[project]
name = "search-operator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "pandas>=2.3.2",
    "psycopg>=3.2.9",
    "pyyaml>=6.0.2",
    "requests>=2.32.5",
    "s3fs>=2025.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.10",
]

[tool.pytest.ini_options]
addopts =[
    "--import-mode=importlib",
]
pythonpath = [
    "."
]
